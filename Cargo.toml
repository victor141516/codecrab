[package]
name = "codecrab"
version = "1.10.3"
edition = "2024"
description = "A small, auditable coding agent for the terminal, written in Rust"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
crossterm = "0.29"
croner = "3"
directories = "6"
diffy = "0.4"
rand = "0.9"
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rpassword = "7"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1.1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tattoy-wezterm-term = "0.1.0-fork.5"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.9"
toml_edit = "0.25"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
webbrowser = "1.2"
yaml_serde = "0.10"
unicode-width = "0.2"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
iana-time-zone = "0.1"
kamadak-exif = "0.6"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[profile.release]
lto = "thin"
strip = true
