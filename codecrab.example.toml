# Copy to the platform config directory:
#   Windows: %APPDATA%\codecrab\config\config.toml
#   Linux:   ~/.config/codecrab/config.toml
#   macOS:   ~/Library/Application Support/codecrab/config.toml

# auto selects GPT-5.6 Sol, high reasoning, and Fast when the provider offers it.
model = "auto"
base_url = "https://api.openai.com/v1"
# auto: use ChatGPT OAuth when logged in, otherwise use api_key_env.
# Other accepted values: oauth, api_key.
auth = "auto"
api_key_env = "OPENAI_API_KEY"
# Set api_key_env = "" for a trusted local provider that needs no Authorization header.
request_timeout_seconds = 180

# Managed automatically as projects acquire or lose saved sessions.
# Paths may also be added manually.
session_directories = []
