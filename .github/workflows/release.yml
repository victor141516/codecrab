name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create or reuse draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" != "true" ]]; then
              echo "::error::Release ${GITHUB_REF_NAME} already exists and is published"
              exit 1
            fi
            echo "Reusing existing draft release ${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "CodeCrab ${GITHUB_REF_NAME}"
          fi

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    continue-on-error: ${{ !matrix.required }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
            asset: windows-x64.exe
            required: true
          - platform: Windows
            arch: ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable_suffix: .exe
            asset: windows-arm64.exe
            required: false
          - platform: macOS
            arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            executable_suffix: ""
            asset: macos-x64
            required: true
          - platform: macOS
            arch: ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            executable_suffix: ""
            asset: macos-arm64
            required: false
          - platform: Linux
            arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
            asset: linux-x64
            required: true
          - platform: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable_suffix: ""
            asset: linux-arm64
            required: false

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          cp \
            "target/${{ matrix.target }}/release/codecrab${{ matrix.executable_suffix }}" \
            "dist/codecrab-${{ github.ref_name }}-${{ matrix.asset }}"

      - name: Upload binary to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/codecrab-${GITHUB_REF_NAME}-${{ matrix.asset }}" \
            --clobber

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Require all priority x64 binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          assets="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          for required in \
            "codecrab-${GITHUB_REF_NAME}-windows-x64.exe" \
            "codecrab-${GITHUB_REF_NAME}-macos-x64" \
            "codecrab-${GITHUB_REF_NAME}-linux-x64"
          do
            if ! grep --fixed-strings --line-regexp --quiet "${required}" <<<"${assets}"; then
              echo "::error::Draft release is missing required asset ${required}"
              exit 1
            fi
          done

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
